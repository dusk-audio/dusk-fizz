name: build

on:
  push:
    branches: [dusk-studio]
  pull_request:
    branches: [dusk-studio]

jobs:
  library-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: |
          cmake -S . -B build \
            -D CMAKE_BUILD_TYPE=Release \
            -D SFIZZ_TESTS=ON \
            -D SFIZZ_JACK=OFF \
            -D SFIZZ_RENDER=OFF \
            -D SFIZZ_DEMOS=OFF \
            -D SFIZZ_DEVTOOLS=OFF
      - name: Build
        run: cmake --build build -j 4
      # The test harness locates tests/TestFiles by walking up from the
      # working directory, so it runs from the in-tree build directory.
      - name: Test
        run: cd build && ./tests/sfizz_tests
